[project]
name = "endo-label"
version = "0.1.0"
description = "Endoscopic surgical-video labeling: phase, class, triplet, mask"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
scribble = [
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "opencv-python==4.11.0.86",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["endo_label*"]
